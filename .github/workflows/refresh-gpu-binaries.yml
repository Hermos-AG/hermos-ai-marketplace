name: refresh-gpu-binaries

# Rebuilds the gpu-mcp binaries from the Go source committed in plugins/gpu-mcp/ and
# publishes them as a workflow artifact, so nobody needs a local Go toolchain.
#
# Why an artifact and not a pull request: the organisation currently forces a read-only
# GITHUB_TOKEN ("Workflow permissions: read repository contents" in the org's Actions
# settings), so a workflow cannot push a branch or open a pull request. Once an owner
# switches the org to "Read and write permissions" plus "Allow GitHub Actions to create and
# approve pull requests", this workflow can commit and open the PR itself.
#
# Until then: download the artifact, drop both binaries into plugins/gpu-mcp/ (or use
# scripts/sync-gpu-mcp.ps1 -BinariesFrom <unzipped folder>), and open the pull request.

on:
  workflow_dispatch:
    inputs:
      catalog_version:
        description: "Catalog version to plan for (empty = patch bump of the current one)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/gpu-mcp/go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build binaries from the committed source
        working-directory: plugins/gpu-mcp
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o gpu-mcp.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o gpu-mcp-linux .

      - name: Smoke test the fresh Linux binary
        working-directory: plugins/gpu-mcp
        run: |
          chmod +x test/fakebin/nvidia-smi gpu-mcp-linux
          PATH="$PWD/test/fakebin:$PATH" ./gpu-mcp-linux < test/session.jsonl > out.jsonl
          python3 test/check_session.py out.jsonl
          rm -f out.jsonl

      - name: Requirement check honours the VRAM threshold
        working-directory: plugins/gpu-mcp
        run: |
          set +e
          PATH="$PWD/test/fakebin:$PATH" ./gpu-mcp-linux --check; met=$?
          PATH="$PWD/test/fakebin:$PATH" GPU_MCP_MIN_VRAM_MB=999999 ./gpu-mcp-linux --check; notmet=$?
          set -e
          [ "$met" -eq 0 ] || { echo "::error::expected RESULT: MET"; exit 1; }
          [ "$notmet" -ne 0 ] || { echo "::error::expected RESULT: NOT MET"; exit 1; }

      - name: Plan version changes
        id: bump
        run: python scripts/bump_versions.py "${{ inputs.catalog_version }}"

      - name: Validate catalog with the planned versions
        run: python scripts/validate_catalog.py .

      - name: Summary
        run: |
          {
            echo "## gpu-mcp binaries rebuilt"
            echo
            echo "- plugin version: **${{ steps.bump.outputs.plugin_version }}**"
            echo "- catalog version: **${{ steps.bump.outputs.catalog_version }}**"
            echo
            echo "### Planned manifest changes"
            echo '```diff'
            git diff -- .claude-plugin/marketplace.json plugins/gpu-mcp/.claude-plugin/plugin.json || true
            echo '```'
            echo
            echo "Download the artifact, copy both binaries into \`plugins/gpu-mcp/\`"
            echo "(or run \`pwsh scripts/sync-gpu-mcp.ps1 -BinariesFrom <unzipped folder>\`),"
            echo "then open the pull request. Merging it triggers the sync to Claude."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-mcp-${{ steps.bump.outputs.plugin_version }}-binaries
          path: |
            plugins/gpu-mcp/gpu-mcp.exe
            plugins/gpu-mcp/gpu-mcp-linux
          retention-days: 30