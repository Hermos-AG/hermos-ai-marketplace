name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog, plugin manifests and bilingual docs
        run: python scripts/validate_catalog.py .

      - name: Claude plugin validate (informational)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || {
            echo "claude CLI not installable in CI — skipping"; exit 0; }
          claude plugin validate . || echo "claude plugin validate reported findings (informational)"